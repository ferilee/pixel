version: '3.8'

services:
  pixel-frontend:
    image: ghcr.io/ferilee/pixel:latest
    container_name: pixel-frontend
    command: bunx serve -s dist -l 3333
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - pixel-network

  pixel-backend:
    image: ghcr.io/ferilee/pixel:latest
    container_name: pixel-backend
    command: bun run server
    ports:
      - "3334:3334"
    volumes:
      - pixel-data:/app/sqlite.db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - pixel-network

volumes:
  pixel-data:

networks:
  pixel-network:
    driver: bridge
