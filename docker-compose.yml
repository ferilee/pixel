version: '3.8'

services:
  pixel-app:
    image: ghcr.io/ferilee/pixel:latest
    container_name: pixel-app
    command: bun run server
    ports:
      - "3333:3334"
    volumes:
      - pixel-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/sqlite.db
    restart: unless-stopped
    networks:
      - pixel-network

volumes:
  pixel-data:

networks:
  pixel-network:
    driver: bridge
